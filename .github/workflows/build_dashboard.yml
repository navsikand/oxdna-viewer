name: Build Dashboard From External Repo

on:
  repository_dispatch:
    types: [update-dashboard]

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout oxdna-viewer repository
        uses: actions/checkout@v3
        with:
          # This token is necessary to push the build files back to the repo
          token: ${{ secrets.PAT_FOR_PUSH }}

      - name: Update and build oxCloudDash
        run: |
          # If the directory exists and is a git repo, pull the latest changes.
          if [ -d "oxCloudDash/.git" ]; then
            echo "oxCloudDash found, pulling latest changes."
            cd oxCloudDash && git pull
          # Otherwise, clone it for the first time.
          else
            echo "oxCloudDash not found, cloning repository."
            rm -rf oxCloudDash # Clean up just in case
            git clone https://github.com/subhajit-Roy-Partho/oxclouddash.git oxCloudDash
            cd oxCloudDash
          fi
          
          # Now, install dependencies and build
          echo "Installing dependencies and building..."
          npm install
          npm run build
        env:
          NODE_ENV: production
          # Without these the build falls back to the endpoint defaults, which used
          # to be https://nanoapi.navraj.me - a dead route (502, no CORS headers)
          # that was shipped to production by exactly this workflow. They are
          # injected here so an automated rebuild cannot regress the endpoints even
          # if the dashboard repository's defaults change.
          NEXT_PUBLIC_API_BASE_URL: https://boltzmann-cpp-oxcloud.navraj.me
          NEXT_PUBLIC_API_BASE_URL_PUBLIC: https://boltzmann-cpp-oxcloud.navraj.me
          NEXT_PUBLIC_API_AUTH_BASE_URL: https://api.nanobase.org/api/v1
          NEXT_PUBLIC_API_AUTH_BASE_URL_PUBLIC: https://api.nanobase.org/api/v1

      - name: Verify the built endpoints before committing
        run: |
          # Fail the job instead of publishing a bundle that points at a dead host.
          if grep -rq "nanoapi" dist/dash/_next/static/chunks/ 2>/dev/null; then
            echo "::error::the built bundle references nanoapi.navraj.me (dead host)"
            exit 1
          fi
          for expected in "https://boltzmann-cpp-oxcloud.navraj.me" "https://api.nanobase.org/api/v1"; do
            if ! grep -rq "$expected" dist/dash/_next/static/chunks/ 2>/dev/null; then
              echo "::error::the built bundle is missing $expected"
              exit 1
            fi
          done
          echo "endpoints verified: no nanoapi, expected hosts present"
      - name: Commit and push build files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f dist/dash
          # Only commit and push if there are actual changes to the build files
          if git diff --staged --quiet; then
            echo "No new build files to commit."
          else
            git commit -m "build: Update oxCloudDash from external trigger"
            git push
          fi
